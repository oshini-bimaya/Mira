<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MIRA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #F5F2F7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .logo {
            color: #7654bb;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        h2 {
            color: #292333;
            font-size: 25px;
            margin-bottom: 12px;
        }

        p {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #7654bb;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff8a3d, #e04b7a);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #7654bb;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.6;
        }

        .success {
            color: #228b50;
        }

        .error {
            color: #d43c3c;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">MIRA</div>

        <h2>Forgot Password?</h2>

        <p>
            Enter your registered email address.
            We'll send you a link to reset your password.
        </p>

        <form id="forgotForm">

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

            <button type="submit" id="submitBtn">
                Send Reset Link
            </button>

        </form>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

    </div>

    <script>
        const form = document.getElementById("forgotForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitBtn");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            button.disabled = true;
            button.textContent = "Sending...";
            message.textContent = "";
            message.className = "message";

            try {
                const response = await fetch("forgot-password.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({ email })
                });

                const data = await response.json();

                message.textContent = data.message ||
                    "Unable to process your request.";

                message.className = response.ok
                    ? "message success"
                    : "message error";

            } catch (error) {
                message.textContent =
                    "Something went wrong. Please try again later.";

                message.className = "message error";
            } finally {
                button.disabled = false;
                button.textContent = "Send Reset Link";
            }
        });
    </script>

</body>
</html>
