

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | MIRA</title>

    <link rel="stylesheet" href="style.css">
    <script src="login.js?v=12" defer></script>
    <script src="theme.js" defer></script>
</head>

<body class="login-page">
    <main class="login-card">

        <a href="index.html"
           class="back-button"
           aria-label="Return to homepage">
            &times;
        </a>

        <section class="login-panel" aria-labelledby="loginTitle">
            <img src="Assets/mira-logo-light.jpeg" alt="MIRA" class="login-logo mira-logo-for-light"><img src="Assets/mira-logo-dark.png" alt="" aria-hidden="true" class="login-logo mira-logo-for-dark">

            <h1 id="loginTitle">Welcome to MIRA</h1>
            <p class="subtitle">Log in to explore student creativity.</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       autocomplete="username"
                       required>

                <label for="password">Password</label>

                <div class="password-box">
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>

                    <button type="button"
                            id="showPassword"
                            class="show-password"
                            aria-controls="password"
                            aria-pressed="false">
                        Show
                    </button>
                </div>

                <a href="forgot-password.html" class="forgot-link">
                    Forgot password?
                </a>

                <button type="submit" class="submit-login">
                    Log In
                </button>

                <p id="loginStatus" role="status"></p>
            </form>

            <p class="signup-text">
                New to MIRA?
                <a href="signin.html">Create an account</a>
            </p>
        </section>

        <aside class="side-panel">
            <div class="qr-placeholder">
                <a href="https://mira-nsbm.infinityfreeapp.com/MIRA/login.html"
                   target="_blank"
                   rel="noopener noreferrer"
                   aria-label="Open MIRA website">
                    <img
                        src="./Assets/MIRA_login_QR.png"
                        alt="Scan QR code to open MIRA login page"
                        style="width:180px; max-width:100%; height:auto; display:block;"
                    >
                </a>
            </div>

            <h2>Your creativity belongs here.</h2>
            <p>
                Discover artwork, share your creations,
                and connect with student artists.
            </p>
        </aside>

    </main>
</body>
</html>
