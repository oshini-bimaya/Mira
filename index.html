<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIRA | NSBM ArtCraft</title>

    <link rel="stylesheet" href="style.css">
    <script src="carousel.js" defer></script>
</head>

<body class="mira-home">

    <header class="header">
        <a href="index.html">
            <img src="./Assets/logo without bg.jpeg"
                 alt="MIRA NSBM"
                 class="header-logo">
        </a>

        <nav class="header-buttons">
            <a href="login.html" class="button login-link">
                Log In
            </a>

            <a href="signin.html" class="button signup-link">
                Sign Up
            </a>
        </nav>
    </header>

    <main class="mira-showcase">

        <div class="showcase-intro">
            <p class="showcase-label">NSBM ART & CRAFT CAFE</p>
            <h1>A space for your imagination.</h1>
            <p>Explore art, handcrafts, and ideas by our student creators.</p>
        </div>

        <section class="mira-stage" aria-label="Featured student artworks">
            <div class="mira-orbit" id="artOrbit">

                <figure class="mira-art">
                    <img src="./Assests\art1.jpeg" alt="Student painting">
                    <figcaption>Painting</figcaption>
                </figure>

                <figure class="mira-art">
                    <img src="./Assests\art2.jpeg" alt="Student pencil sketch">
                    <figcaption>Drawing & Sketching</figcaption>
                </figure>

                <figure class="mira-art">
                    <img src="./Assests\art3.jpeg" alt="Student handcrafted item">
                    <figcaption>Handcrafts</figcaption>
                </figure>

                <figure class="mira-art">
                    <img src="./Assests\art4.jpeg" alt="Student photography">
                    <figcaption>Digital Art & Graphic Designing</figcaption>
                </figure>

                <figure class="mira-art">
                    <img src="./Assests\art5.jpeg" alt="Student digital artwork">
                    <figcaption>Photography</figcaption>
                </figure>

                <figure class="mira-art">
                    <img src="./Assests\art6.jpeg" alt="Student creative project">
                    <figcaption>Sculpture & 3D Art</figcaption>
                </figure>

            </div>
        </section>

        <button type="button"
                class="mira-motion-button"
                id="motionButton"
                aria-controls="artOrbit">
            Pause animation
        </button>

    </main>

    <footer class="mira-home-footer">
        <p>WHERE STUDENT CREATIVITY COMES TO LIFE</p>
    </footer>

</body>
</html>
